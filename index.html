<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fauzan | Teman Perubahan</title>
  <link rel="icon" href="https://i.imgur.com/EKbMawI.jpg">
  
  <!-- Font Playfair (Klasik/Elegan) & Inter (Bersih/Modern) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  
  <style>
    /* --- MINIMALIST LUXURY TOKENS --- */
    :root {
      --bg-color: #030303;      /* Hitam solid pekat */
      --text-main: #ffffff;
      --text-muted: #8a8a8a;
      --gold-accent: #d4af37;   /* Emas elegan, tidak mencolok */
      --border-color: #1f1f1f;  /* Garis batas sangat tipis */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* --- CONTAINER --- */
    .container {
      width: 100%;
      max-width: 480px;
      padding: 60px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: fadeIn 0.8s ease-out forwards;
    }

    /* --- PROFILE --- */
    .profile-img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      filter: grayscale(100%); /* Hapus baris ini jika ingin foto berwarna */
      margin-bottom: 24px;
      border: 1px solid var(--border-color);
      padding: 4px;
    }

    /* --- TYPOGRAPHY --- */
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--gold-accent);
      margin-bottom: 24px;
    }

    .bio {
      font-size: 0.95rem;
      font-weight: 300;
      color: var(--text-muted);
      margin-bottom: 40px;
      line-height: 1.8;
    }

    .bio strong {
      color: var(--text-main);
      font-weight: 400;
    }

    /* --- LINK BUTTONS --- */
    .links-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 40px;
    }

    .btn {
      width: 100%;
      padding: 18px 20px;
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 400;
      letter-spacing: 0.5px;
      border-radius: 4px; /* Sudut sedikit tegas untuk kesan profesional */
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn-primary {
      background: var(--text-main);
      color: var(--bg-color);
      font-weight: 500;
      border: none;
    }

    /* Efek Hover Elegan */
    .btn:hover {
      border-color: var(--text-muted);
    }

    .btn-primary:hover {
      background: var(--gold-accent);
      color: var(--bg-color);
    }

    /* --- INFO & IMAGE --- */
    .info-section {
      width: 100%;
      border-top: 1px solid var(--border-color);
      padding-top: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .schedule {
      font-family: 'Playfair Display', serif;
      font-size: 0.95rem;
      color: var(--gold-accent);
    }

    .schedule span {
      display: block;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .art-image {
      width: 100%;
      max-width: 220px;
      opacity: 0.5;
      filter: grayscale(100%);
      transition: opacity 0.3s ease;
    }

    .art-image:hover {
      opacity: 0.8;
    }

    /* --- SOCIAL ICONS --- */
    .socials {
      display: flex;
      gap: 24px;
      margin-top: 10px;
    }

    .socials a {
      display: block;
      transition: opacity 0.3s ease;
      opacity: 0.5;
    }

    .socials img {
      width: 20px;
      height: 20px;
      filter: invert(100%);
    }

    .socials a:hover {
      opacity: 1;
    }

    /* --- FOOTER --- */
    footer {
      margin-top: 30px;
      font-size: 0.75rem;
      color: #444;
      letter-spacing: 1px;
    }

    /* --- ANIMATION --- */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <main class="container">
    
    <!-- Link gambar baru dimasukkan di sini -->
    <img class="profile-img" src="https://drive.google.com/thumbnail?id=1TLZJ2tYFNbmdDoJIQXaMG4TVYBQLi7mQ&sz=w1000" alt="Fauzan Profile">
    
    <h1>Fauzan</h1>
    <div class="subtitle">Teman Perubahan</div>
    
    <p class="bio">
      Memadukan <strong>intuisi spiritual</strong> dan <strong>analisa logis</strong> untuk menyentuh akar masalah serta memandu proses transformasimu.
    </p>

    <div class="links-wrapper">
      <a href="https://fauzantarot.github.io/Pricelist/" target="_blank" class="btn btn-primary">Booking Sesi Sekarang</a>
      <a href="https://fauzantarot.github.io/TarotgratisFauzan/" target="_blank" class="btn">Mini Reading Gratis</a>
      <a href="https://fauzantarot.github.io/Numerology/" target="_blank" class="btn">Analisa Numerology</a>
      <a href="https://drive.google.com/drive/folders/1ZNTNJdw2JEy74JxwqfDnRX6ds72Mw0m9" target="_blank" class="btn">Testimoni Klien</a>
      <a href="https://drive.google.com/drive/folders/1ZTqqTixkERhGKZuvZU0XT37AMTtY0Dka" target="_blank" class="btn">Perjalanan Belajar</a>
    </div>

    <section class="info-section">
      <div class="schedule">
        Waktu Layanan
        <span>12:00 – 23:30 WITA (Libur Selasa)</span>
      </div>

      <img class="art-image" src="https://i.imgur.com/izh8lU9.jpeg" alt="Ilustrasi">

      <div class="socials">
        <a href="https://www.tiktok.com/@fauzantarot" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" alt="TikTok"></a>
        <a href="https://www.instagram.com/fauzantarot" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" alt="Instagram"></a>
        <a href="https://www.facebook.com/fauzantarot" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook"></a>
        <a href="https://www.youtube.com/@fauzantarot" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YouTube"></a>
      </div>
    </section>

    <footer>
      © 2026 Fauzan
    </footer>

  </main>

</body>
</html>
